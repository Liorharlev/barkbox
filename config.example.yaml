# barkbox configuration TEMPLATE — safe default values, no personal settings.
# On a new deployment: cp config.example.yaml config.yaml
# The app and the web UI read and write config.yaml (git-ignored); this file is
# only the starting point. Keep the two structures in sync when adding options.

enabled: true                      # master switch — off = total silence

schedule:
  mode: always                     # always | active_window | quiet_window
  active_window: { start: "07:00", end: "23:00" }   # used when mode=active_window
  quiet_window:  { start: "02:00", end: "05:00" }   # used when mode=quiet_window
  # active_window = active ONLY between start and end.
  # quiet_window  = silent ONLY between start and end, active the rest of the day.

presence:
  mode: away                       # home | away — set from the UI
  multipliers:                     # activity-rate multiplier: smaller = longer gaps
    home: 0.25                     # at home: very few barks (UI shows this as "slow down by x4")
    away: 1.0                      # away: full activity

timing:
  day_parts:
    morning: ["06:00", "10:00"]
    day:     ["10:00", "17:00"]
    evening: ["17:00", "22:00"]
    night:   ["22:00", "06:00"]
  frequency: medium                # low | medium | high (before the presence multiplier)
  frequency_presets:               # the minute range behind each preset — editable from the UI
    low:    { min_gap_minutes: 45, max_gap_minutes: 150 }
    medium: { min_gap_minutes: 15, max_gap_minutes: 60 }
    high:   { min_gap_minutes: 5,  max_gap_minutes: 20 }

# Each episode plays toward a random target picked from episode_duration_seconds
# (measured across playback + the intra_gap_seconds pauses). The target is only
# checked after a whole clip finishes, never mid-clip. max_barks is a safety cap
# so very short clips can't loop forever. A behavior with no
# episode_duration_seconds (idle) plays exactly one bark.
behaviors:
  alert:                           # guarding / territory — a real guard bark runs a good while
    enabled: true
    weight: 1.0
    time_weights: { morning: 1.0, day: 0.8, evening: 1.2, night: 1.5 }
    episode_duration_seconds: [15, 45]
    max_barks: 40
    intra_gap_seconds: [2, 12]
    clip_tags: [alert]
  response:                        # answering a distant dog — most frequent, natural "background"
    enabled: true
    weight: 2.0
    time_weights: { morning: 1.2, day: 1.0, evening: 1.1, night: 0.6 }
    episode_duration_seconds: [3, 10]
    max_barks: 40
    intra_gap_seconds: [1, 4]
    clip_tags: [response]
  chase:                           # chasing a bird / cat
    enabled: true
    weight: 0.7
    time_weights: { morning: 1.5, day: 0.8, evening: 1.3, night: 0.1 }
    episode_duration_seconds: [8, 20]
    max_barks: 40
    intra_gap_seconds: [0.5, 2]
    clip_tags: [chase]
  noise_reaction:                  # reacting to an outside noise
    enabled: true
    weight: 1.0
    time_weights: { morning: 1.0, day: 1.0, evening: 1.0, night: 0.7 }
    episode_duration_seconds: [5, 15]
    max_barks: 40
    intra_gap_seconds: [1, 3]
    clip_tags: [noise]
  idle:                            # just because, no trigger — always a single bark
    enabled: true
    weight: 0.3
    time_weights: { morning: 1.0, day: 1.0, evening: 1.0, night: 0.5 }
    max_barks: 1
    intra_gap_seconds: [0, 0]
    clip_tags: [idle]

anti_repeat:
  no_repeat_last: 3                 # don't reuse any of the last N clips

audio:
  backend: auto                    # auto | ffmpeg | ffplay | aplay | mpg123 | mock
                                   #   ffmpeg  — .wav + .mp3, has volume, decodes+scales then
                                   #             pipes straight into `aplay` — pure ALSA, no SDL/
                                   #             Pulse/PipeWire involved anywhere  ← best on a
                                   #             headless Pi service (needs ffmpeg + alsa-utils)
                                   #   ffplay  — .wav + .mp3, has volume, but renders via SDL,
                                   #             which needs a Pulse/PipeWire session — flaky
                                   #             under a plain systemd service (no login session)
                                   #   aplay   — .wav only, NO volume     (alsa-utils)
                                   #   mpg123  — .mp3 only (plays .wav as silence!)
                                   # 'auto' prefers ffmpeg, then ffplay, then aplay, then mpg123,
                                   # and per-file falls back to one that fits the format.
  device: default                  # ALSA device on the Pi. 'default', or e.g. plughw:0,0
                                   # (card 0, with rate/format conversion — use plughw, not hw).
  volume: 0.9                       # 0.0 - 1.0 — base gain, applies to ALL playback
                                    # (ffmpeg/ffplay/mpg123 only; aplay always plays at 100%)
  master_volume: 100               # 0-100 — set from the UI in place of a knob on the
                                   # speaker. Applies to scheduled episodes AND manual
                                   # test barks (so a test previews the real level);
                                   # the alarm still plays at full volume.

# Distance simulation: in an episode long enough to imply the dog is moving
# around, each bark's volume drifts from the previous one in a bounded random
# walk, so an outside listener hears a dog that isn't standing in one spot.
#   final_gain = (master_volume / 100) * (distance_volume / 100)
# where distance_volume is 100 for any episode at or under the threshold.
distance_simulation:
  enabled: true
  min_episode_duration_seconds: 6  # only episodes whose target duration exceeds this drift
  volume_range: [40, 100]          # percent bounds for the walk
  max_step: 20                     # max percent change between consecutive barks
  start_volume: null               # null = random within volume_range; or a fixed percent

paths:
  sounds_dir: sounds
  tags_file: sounds/tags.yaml

web:
  host: "0.0.0.0"
  port: 8080
  auth_token: null                 # set a string to require ?token= or Authorization: Bearer

alarm:                             # stub — overrides the schedule/presence gates, but NOT
                                   # the master switch (enabled:false stops the alarm too).
                                   # Stoppable early from the UI ("Stop alarm").
  enabled: false
  duration_minutes: 10             # how long alarm mode stays active
  episode_duration_seconds: [10, 25]   # length of each burst within that window
  max_barks: 40
  episode_gap_seconds: [1, 4]      # pause between bursts
