# barkbox configuration — the single source of truth.
# Copy to config.yaml (the web UI reads and writes that file).

enabled: true                      # master switch — off = total silence

schedule:
  mode: always                     # always | active_window | quiet_window
  active_window: { start: "07:00", end: "23:00" }   # used when mode=active_window
  quiet_window:  { start: "02:00", end: "05:00" }   # used when mode=quiet_window
  # active_window = active ONLY between start and end.
  # quiet_window  = silent ONLY between start and end, active the rest of the day.

presence:
  mode: away                       # home | away — set from the UI
  multipliers:                     # activity-rate multiplier: smaller = longer gaps
    home: 0.25                     # at home: very few barks, natural
    away: 1.0                      # away: full activity

timing:
  day_parts:
    morning: ["06:00", "10:00"]
    day:     ["10:00", "17:00"]
    evening: ["17:00", "22:00"]
    night:   ["22:00", "06:00"]
  frequency: medium                # low | medium | high (before the presence multiplier)
  frequency_presets:
    low:    { min_gap_minutes: 45, max_gap_minutes: 150 }
    medium: { min_gap_minutes: 15, max_gap_minutes: 60 }
    high:   { min_gap_minutes: 5,  max_gap_minutes: 20 }

behaviors:
  alert:                           # guarding / territory
    enabled: true
    weight: 1.0
    time_weights: { morning: 1.0, day: 0.8, evening: 1.2, night: 1.5 }
    episode_barks: [2, 5]
    intra_gap_seconds: [2, 12]
    clip_tags: [alert]
  response:                        # answering a distant dog — most frequent, natural "background"
    enabled: true
    weight: 2.0
    time_weights: { morning: 1.2, day: 1.0, evening: 1.1, night: 0.6 }
    episode_barks: [1, 2]
    intra_gap_seconds: [1, 4]
    clip_tags: [response]
  chase:                           # chasing a bird / cat
    enabled: true
    weight: 0.7
    time_weights: { morning: 1.5, day: 0.8, evening: 1.3, night: 0.1 }
    episode_barks: [3, 6]
    intra_gap_seconds: [0.5, 2]
    clip_tags: [chase]
  noise_reaction:                  # reacting to an outside noise
    enabled: true
    weight: 1.0
    time_weights: { morning: 1.0, day: 1.0, evening: 1.0, night: 0.7 }
    episode_barks: [1, 3]
    intra_gap_seconds: [1, 3]
    clip_tags: [noise]
  idle:                            # just because, no trigger
    enabled: true
    weight: 0.3
    time_weights: { morning: 1.0, day: 1.0, evening: 1.0, night: 0.5 }
    episode_barks: [1, 1]
    intra_gap_seconds: [0, 0]
    clip_tags: [idle]

anti_repeat:
  no_repeat_last: 3                 # don't reuse any of the last N clips

audio:
  backend: auto                    # auto | mpg123 | aplay | ffplay | mock
  device: default                  # ALSA device (on the Pi)
  volume: 0.9                       # 0.0 - 1.0

paths:
  sounds_dir: sounds
  tags_file: sounds/tags.yaml

web:
  host: "0.0.0.0"
  port: 8080
  auth_token: null                 # set a string to require ?token= or Authorization: Bearer

alarm:                             # stub — external override, not part of normal behavior choice
  enabled: false
  duration_minutes: 10
  episode_barks: [8, 15]
  episode_gap_seconds: [1, 4]
